<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Events</title>
  </head>
  <body>
    <h2>JavaScript Events</h2>

    <button id="clickBtn">Click Me</button>
    <div id="box" style="padding: 20px; background: lightblue; margin: 10px 0">
      Move your mouse over this box
    </div>

    <input type="text" id="keyInput" placeholder="Type something" />

    <form id="myForm">
      <input type="text" id="username" placeholder="Enter username" required />
      <input type="email" id="email" placeholder="Enter email" required />
      <button type="submit">Submit</button>
    </form>

    <script>
      // ==================================================
      // 1. MOUSE EVENTS
      // ==================================================
      // Mouse events occur when a user interacts with
      // webpage elements using a mouse or similar pointer.

      var btn = document.querySelector("#clickBtn");
      var box = document.querySelector("#box");
      var kin = document.querySelector("#keyInput");

      // element.addEventListener(event, handling_function)
      // --------------------------------------------------
      // 1.1 CLICK
      // --------------------------------------------------
      // Occurs when an element is clicked.

      btn.addEventListener("click", () => {
        console.log("Button is Clicked");
      });

      // --------------------------------------------------
      // 1.2 DBLCLICK
      // --------------------------------------------------
      // Occurs when an element is double-clicked.

      btn.addEventListener("dblclick", () => {
        alert("Double Click Triggered !!!");
      });
      // --------------------------------------------------
      // 1.3 MOUSEOVER AND MOUSEOUT
      // --------------------------------------------------
      // mouseover occurs when the pointer enters an element
      // or one of its descendants.
      // mouseout occurs when the pointer leaves an element
      // or moves into a different descendant.

      box.addEventListener("mouseover", () => {
        box.style.backgroundColor = "red";
      });

      box.addEventListener("mouseout", () => {
        box.style["background-color"] = "lightblue";
      });

      // --------------------------------------------------
      // 1.4 MOUSEMOVE
      // --------------------------------------------------
      // Occurs when the mouse pointer moves over an element.
      // It can fire frequently, so avoid expensive work.

      // box.addEventListener("mousemove", (event) => {
      //   console.log("Mouse Pointer :", event.clientX, event.clientY);
      // });

      // --------------------------------------------------
      // 1.5 MOUSEDOWN AND MOUSEUP
      // --------------------------------------------------
      // mousedown occurs when a mouse button is pressed.
      // mouseup occurs when a pressed mouse button is released.
      box.addEventListener("mousedown", () => {
        box.style.backgroundColor = "yellow";
      });

      box.addEventListener("mouseup", () => {
        box.style.backgroundColor = "red";
      });

      // ==================================================
      // 2. KEYBOARD EVENTS
      // ==================================================
      // Keyboard events occur when keys are pressed or
      // released while an element has keyboard focus.

      // --------------------------------------------------
      // 2.1 KEYDOWN
      // --------------------------------------------------
      // Occurs when a key is pressed.
      // event.key gives the key value, such as "Enter" or "a".
      // event.code identifies the physical key, such as "KeyA".

      kin.addEventListener("keydown", (event) => {
        console.log(event.key, event.code);
        if (event.key === "s") alert("s is pressed");
      });

      // --------------------------------------------------
      // 2.2 KEYUP
      // --------------------------------------------------
      // Occurs when a pressed key is released.

      document.addEventListener('keyup', (event)=>{
        if(event.key === 'a') alert('a is released');
      })

      // --------------------------------------------------
      // 2.3 DETECTING THE ENTER KEY
      // --------------------------------------------------
      // Check event.key to perform an action when Enter
      // is pressed.

      // --------------------------------------------------
      // 2.4 PREVENTING DEFAULT KEY BEHAVIOR
      // --------------------------------------------------
      // preventDefault() cancels a cancelable event's
      // default browser action.
      // Use it carefully to avoid disrupting accessibility.

      // ==================================================
      // 3. FORM EVENTS
      // ==================================================
      // Form events occur when users interact with form
      // controls or submit a form.

      // --------------------------------------------------
      // 3.1 INPUT EVENT
      // --------------------------------------------------
      // Fires whenever the value of an input changes
      // through user interaction.

      // --------------------------------------------------
      // 3.2 CHANGE EVENT
      // --------------------------------------------------
      // Fires when a control's value is committed.
      // For text inputs, this commonly occurs after the
      // value changes and the control loses focus.

      // --------------------------------------------------
      // 3.3 FOCUS AND BLUR
      // --------------------------------------------------
      // focus occurs when an element receives focus.
      // blur occurs when an element loses focus.

      email.addEventListener("")

      // --------------------------------------------------
      // 3.4 SUBMIT EVENT
      // --------------------------------------------------
      // Occurs when the form is submitted.
      // preventDefault() prevents the browser's default
      // form submission and page navigation.

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        console.log({
            name: userName.value ="";
            email.value = "";
        })
      })

      // --------------------------------------------------
      // 3.5 RESET EVENT
      // --------------------------------------------------
      // Occurs when a form reset is requested.
      // The browser normally restores controls to their
      // default values after the reset event completes.

      form.addEventListener("reset" , (event) => {
        event.preventDefault();
        userName.value = "";
        email.value = "";
      })

      // ==================================================
      // 4. EVENT OBJECT
      // ==================================================
      // Event handlers receive an event object containing
      // information about the event.
      //
      // event.type: The event type.
      // event.target: The element where the event originated.
      // event.currentTarget: The element whose handler runs.
      // event.preventDefault(): Cancels the default action
      // when the event is cancelable.
      // event.stopPropagation(): Stops further propagation.

      // ==================================================
      // 5. IMPORTANT DIFFERENCES
      // ==================================================
      // click: Mouse or pointer click.
      // dblclick: Double-click.
      // mouseover / mouseout: Pointer enters or leaves,
      // including transitions involving descendants.
      // mouseenter / mouseleave: Entering or leaving without
      // bubbling from descendant transitions.
      // keydown: Key pressed.
      // keyup: Key released.
      // input: Value changes during editing.
      // change: Value is committed.
      // focus / blur: Focus gained or lost.
      // submit: Form submission requested.
      // reset: Form reset requested.
      //
      // Use addEventListener() to register event handlers.
      // Use event.key rather than deprecated keyCode values.
      // HTML validation and server-side validation should
      // both be considered when processing form data.
    </script>
  </body>
</html>
