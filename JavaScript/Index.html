<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        if(true){
            console.log('Hello');
        }

        if(false){
            console.log('World');
        }else{
            console.log('Not In Conditions');
        }

        var num = parseInt(prompt("Enter Your Number"));

        if(num >= 80){
            console.log('Grade A');
        }else if(num >= 60){
            console.log('Grade B');
        }else{
            console.log('Good');
        }

        //Switch
        var str = "Tues";

        switch (str) {
            case "Mon":
                console.log("Monday");
                break;
            case "Tues":
                console.log("Tuesday");
                break;
            case "Wed":
                console.log("Wednesday");
                break;
            case "Thurs":
                console.log("Thursday");
                break;
            case "Fri":
                console.log("Friday");
                break;
            case "Sat":
                console.log("Saturday");
                break;
            case "Sun":
                console.log("Sunday");
                break;
            default:
                console.log("Invalid Day");
                break;
        }

        //Ternary op
        var ter = (5 == "5") ? 10:50;
        console.log(ter);
        (5 == "5") ? console.log(10) : console.log(50);

        //For Loop
        for(let i=0 ; i<5 ; i++){
            console.log("For Loop : "+i);
        }

        //While Loop
        let n = 506
        while(n>0){
            console.log("While : " + n%10);
            n = Math.floor(n/10);
        }

        //Do-While
        let n2 = 3
        do{
            console.log('do-while' +n2);
            n2 *= 3
        }while(n2<9);

        //Nested Loops
        for(let i=1 ; i<=4 ; i++){
            for(let j=0 ; j<3 ; j++){
                console.log("Nested Loops : "+i*j);
            }
        }
    </script>
</body>
</html>
