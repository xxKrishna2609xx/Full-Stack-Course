<!DOCTYPE html>
<html>
<head>
    <title>2nd Layout</title>
</head>
<frameset cols="20%,15%,*">
    <frameset rows="25%,45%,*">
        <frame src="" name="col1_top">
        <frame src="" name="col1_middle">
        <frame src="" name="col1_bottom">
    </frameset>
    <frameset rows="35%,*">
        <frame src="" name="col2_top">
        <frameset cols="50%,50%">
            <frame src="" name="col2_bottom_left">
            <frameset rows="50%,*">
                <frame src="" name="col2_bottom_right_top">
                <frame src="" name="col2_bottom_right_bottom">
            </frameset>
        </frameset>
    </frameset>
    <frameset rows="20%,*">
        <frameset cols="25%,35%,*">
            <frame src="" name="right_top_1">
            <frame src="" name="right_top_2">
            <frame src="" name="right_top_3">
        </frameset>
        <frameset cols="25%,45%,*">
            <frameset rows="65%,*">
                <frame src="" name="right_bottom_col1_top">
                <frame src="" name="right_bottom_col1_bottom">
            </frameset>
            <frameset rows="35%,40%,*">
                <frame src="" name="right_bottom_col2_top">
                <frame src="" name="right_bottom_col2_middle">
                <frame src="" name="right_bottom_col2_bottom">
            </frameset>
            <frameset rows="75%,*">
                <frame src="" name="right_bottom_col3_top">
                <frame src="" name="right_bottom_col3_bottom">
            </frameset>
        </frameset>
    </frameset>
</frameset>
</html>
