<!DOCTYPE html>
<html>
<head>
    <title>Sample Layout</title>
</head>
<frameset cols="18%,16%,18%,18%,*">
    <frameset rows="20%,37%,*">
        <frame src="" name="col1_top">
        <frame src="" name="col1_middle">
        <frame src="" name="col1_bottom">
    </frameset>
    <frameset rows="28%,*">
        <frame src="" name="col2_top">
        <frameset cols="40%,*">
            <frame src="" name="col2_bottom_left">
            <frameset rows="42%,*">
                <frame src="" name="col2_bottom_right_top">
                <frame src="" name="col2_bottom_right_bottom">
            </frameset>
        </frameset>
    </frameset>
    <frameset rows="20%,48%,*">
        <frame src="" name="col3_top">
        <frame src="" name="col3_middle">
        <frame src="" name="col3_bottom">
    </frameset>
    <frameset rows="20%,28%,28%,*">
        <frame src="" name="col4_top">
        <frame src="" name="col4_middle">
        <frame src="" name="col4_lower_middle">
        <frame src="" name="col4_bottom">
    </frameset>
    <frameset rows="20%,*">
        <frame src="" name="col5_top">
        <frameset cols="50%,50%">
            <frameset rows="70%,*">
                <frame src="" name="col5_middle_left">
                <frame src="" name="col5_bottom_left">
            </frameset>
            <frameset rows="70%,*">
                <frame src="" name="col5_middle_right">
                <frame src="" name="col5_bottom_right">
            </frameset>
        </frameset>
    </frameset>
</frameset>
</html>
